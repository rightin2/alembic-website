<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alembic</title>
  <meta name="description" content="Alembic. Practice management for Australian psychologists. Every client record stays on your machine.">
  <style>
    :root {
      --bg: #1b2a23;
      --ink: #f4efe6;
      --gold: #c9a45c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 34rem; }
    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: 0.04em;
      color: var(--gold);
      font-weight: normal;
    }
    p.tag {
      margin-top: 1.2rem;
      font-size: 1.15rem;
      line-height: 1.6;
      opacity: 0.9;
    }
    p.soon {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <main>
    <h1>Alembic</h1>
    <p class="tag">Practice management for Australian psychologists. Every client record stays on your machine.</p>
    <p class="soon">Coming soon &middot; Alembic Labs</p>
  </main>
</body>
</html>
